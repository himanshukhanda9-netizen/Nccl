apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: nccl-allreduce-2node
spec:
  slotsPerWorker: 8
  runPolicy:
    cleanPodPolicy: Running
  sshAuthMountPath: /root/.ssh
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
          - name: nccl-launcher
            image: docker.io/deepops/nccl-tests:2312
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-c"]
            args:
            - >
              mpirun
              --allow-run-as-root
              -np 16
              -bind-to none
              -map-by slot
              -mca pml ob1
              -mca btl ^openib
              -mca plm_rsh_args "-p 2222 -o ConnectTimeout=30 -o StrictHostKeyChecking=no"
              -mca btl_tcp_if_include bond0
              -x NCCL_DEBUG=INFO
              -x NCCL_IB_HCA=mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_7
              -x NCCL_IB_DISABLE=0
              -x NCCL_NET_GDR_LEVEL=SYS
              -x NCCL_NET_GDR_READ=1
              -x NCCL_SOCKET_IFNAME=bond0
              -x NCCL_SHARP_DISABLE=1
              -x NCCL_COLLNET_ENABLE=0
              -x NCCL_IB_QPS_PER_CONNECTION=4
              -x NCCL_IB_SPLIT_DATA_ON_QPS=1
              -x NCCL_MIN_NCHANNELS=32
              -x NCCL_MAX_NCHANNELS=32
              -x NCCL_NCHANNELS_PER_NET_PEER=4
              -x NCCL_CROSS_NIC=1
              -x NCCL_BUFFSIZE=8388608
              -x NCCL_IB_GID_INDEX=3
              -x LD_LIBRARY_PATH
              -x PATH
              all_reduce_perf_mpi
              -b 1G -e 16G -f 2 -g 1 -n 50 -w 20
    Worker:
      replicas: 2
      template:
        spec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          containers:
          - name: nccl-worker
            image: docker.io/deepops/nccl-tests:2312
            imagePullPolicy: IfNotPresent
            command:
            - /bin/bash
            - -c
            - /usr/sbin/sshd -p 2222 -D
            securityContext:
              privileged: true
              capabilities:
                add: ["IPC_LOCK", "SYS_RESOURCE"]
            resources:
              limits:
                nvidia.com/gpu: 8
            volumeMounts:
            - name: ib
              mountPath: /dev/infiniband
            - name: shm
              mountPath: /dev/shm
          volumes:
          - name: ib
            hostPath:
              path: /dev/infiniband
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
